<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>qna</title>

    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#fbf0f2" />

    <!-- iOS reads these, not the manifest, when deciding whether Add to Home
         Screen produces a standalone web app. The standalone container is
         exempt from the seven-day localStorage eviction, so an installed app
         keeps its session across a gap in use. Since sign-in became email OTP
         that saves a re-authentication rather than an account — see CLAUDE.md
         sections 12 and 13. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="qna" />

    <!-- iOS ignores the manifest's icons array for the home-screen icon and
         reads this instead. The manifest entries serve Android and desktop. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
