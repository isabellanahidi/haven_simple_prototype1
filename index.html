<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/havenlogo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Haven</title>

    <!-- The welcome screen's face, self-hosted: a PWA's first paint should not
         wait on a third party, and the one place this font appears is the
         first thing anyone sees. Latin subset only.

         crossorigin IS REQUIRED EVEN THOUGH THE FILE IS SAME-ORIGIN. Fonts are
         fetched in CORS mode, so without it the preload is discarded and the
         file is fetched a second time -- worse than not preloading at all.
         See CLAUDE.md section 26. -->
    <link
      rel="preload"
      href="/fonts/kaisei-opti-latin-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#feedf1" />

    <!-- iOS reads these, not the manifest, when deciding whether Add to Home
         Screen produces a standalone web app. The standalone container is
         exempt from the seven-day localStorage eviction, so an installed app
         keeps its session across a gap in use. Since sign-in became email OTP
         that saves a re-authentication rather than an account — see CLAUDE.md
         sections 12 and 13. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- iOS reads this, not the manifest's short_name, for the Home Screen label. -->
    <meta name="apple-mobile-web-app-title" content="Haven" />

    <!-- iOS ignores the manifest's icons array for the home-screen icon and
         reads this instead. The manifest entries serve Android and desktop. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
